<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Head -->
  <rect x="70" y="40" width="160" height="140" rx="40" fill="url(#grad1)"/>
  <!-- Eyes -->
  <circle cx="110" cy="90" r="18" fill="white"/>
  <circle cx="190" cy="90" r="18" fill="white"/>
  <!-- Mouth -->
  <path d="M 130 130 Q 150 150 170 130" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="50" cy="100" rx="30" ry="50" fill="url(#grad2)" transform="rotate(-30 50 100)"/>
  <ellipse cx="250" cy="100" rx="30" ry="50" fill="url(#grad2)" transform="rotate(30 250 100)"/>
  <!-- Claws/Hands left -->
  <path d="M 40 160 Q 30 180 20 200" stroke="url(#grad2)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- Claws/Hands right -->
  <path d="M 260 160 Q 270 180 280 200" stroke="url(#grad2)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="150" cy="220" rx="70" ry="60" fill="url(#grad2)"/>
  <!-- Sparkles -->
  <g fill="url(#grad1)">
    <polygon points="200,50 210,65 225,70 210,80 215,95 200,85 185,95 190,80 175,70 190,65" />
    <polygon points="240,80 245,90 255,92 245,98 247,108 240,100 230,108 232,98 222,92 232,90" />
  </g>
</svg>
